<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Тракторные билеты">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Тракторные билеты">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Тракторные билеты</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <!-- ===== Парольная защита ===== -->
    <div id="pw-gate" style="
    position:fixed; inset:0; background:#fff; z-index:99999;
    display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  ">
        <div style="text-align:center; padding:24px; max-width:360px; width:100%;">
            <h2 style="margin:0 0 20px; color:#2e7d32;">Введите пароль</h2>
            <input id="pw-input" type="password" autofocus inputmode="numeric"
                   style="font-size:20px; padding:12px; width:100%; box-sizing:border-box;
                    border:2px solid #ccc; border-radius:8px; text-align:center;
                    letter-spacing:2px;">
            <button id="pw-btn" style="
        font-size:18px; padding:12px 24px; margin-top:12px; width:100%;
        background:#2e7d32; color:#fff; border:none; border-radius:8px;
        cursor:pointer; font-weight:bold;
      ">
                Войти
            </button>
            <p id="pw-err" style="color:#c62828; height:22px; margin:12px 0 0; font-size:14px;"></p>
        </div>
    </div>

    <script>
                    // ============ НАСТРОЙКИ ============
                    // Вставьте свой хеш, полученный на https://emn178.github.io/online-tools/sha256.html
                    const PW_HASH = "3543681e328e560341a6259766f55ddafa25d6831836fc3b5fb3596ba9283b5c";

                    // ===================================

                    async function sha256(str) {
                      const buf = new TextEncoder().encode(str);
                      const hashBuf = await crypto.subtle.digest('SHA-256', buf);
                      return Array.from(new Uint8Array(hashBuf))
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join('');
                    }

                    async function checkPw() {
                      const input = document.getElementById('pw-input').value;
                      const err = document.getElementById('pw-err');
                      if (!input) {
                        err.textContent = 'Введите пароль';
                        return;
                      }
                      const hash = await sha256(input);
                      if (hash === PW_HASH) {
                        try { localStorage.setItem('authed', '1'); } catch (e) {}
                        document.getElementById('pw-gate').style.display = 'none';
                      } else {
                        err.textContent = 'Неверный пароль';
                        document.getElementById('pw-input').value = '';
                        document.getElementById('pw-input').focus();
                      }
                    }

                    document.getElementById('pw-btn').addEventListener('click', checkPw);
                    document.getElementById('pw-input').addEventListener('keydown', e => {
                      if (e.key === 'Enter') checkPw();
                    });

                    // Если уже проходили — сразу пропускаем
                    try {
                      if (localStorage.getItem('authed') === '1') {
                        document.getElementById('pw-gate').style.display = 'none';
                      }
                    } catch (e) {}
    </script>


    <!-- Принудительное отключение Service Worker -->
    <script>
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(rs) {
                rs.forEach(function(r) { r.unregister(); });
              });
              // Через секунду — ещё раз, на случай повторной регистрации
              setTimeout(function() {
                navigator.serviceWorker.getRegistrations().then(function(rs) {
                  rs.forEach(function(r) { r.unregister(); });
                });
              }, 1500);
            }
    </script>

    <!-- ===== Загрузка Flutter ===== -->
    <script src="flutter_bootstrap.js" async></script>
</body>
</html>
